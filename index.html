<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Expense Tracker</title>
    <style>
        
      :root {
        color: #547422;
        background: #f3f6fb;
        font-family: Arial, sans-serif;
      }

      body {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1,
      h2,
      h3 {
        color: #547422;
      }

      .summary-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(23, 63, 115, 0.1);
        padding: 24px;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      .stats p {
        background: #e9f2ff;
        border-radius: 8px;
        margin: 0;
        padding: 12px 16px;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border: 1px solid #d7deea;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #547422;
        color: white;
      }

      tbody tr:nth-child(even) {
        background: #f7f9fc;
      }

      .error {
        color: #a21d1d;
      }
    </style>
  </head>
  <body>
    <h1>Travel Expense Tracker</h1>
    <div id="summary">Loading travel summary...</div>

    <script type="module">
      try {
        const response = await fetch("/summary");

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }

        const summaryHtml = await response.text();
        document.getElementById("summary").innerHTML = summaryHtml;
      } catch (error) {
        document.getElementById("summary").innerHTML =
          `<p class="error">Could not load the summary: ${error.message}</p>`;
      }
    </script>
  </body>
</html>
